<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQUAREGIA</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        #video-background {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            transform: translate(-50%, -50%);
            transition: transform 0.1s;
        }
        h1 {
            position: absolute;
            top: 7%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00FFDD;
            font-size: 4em;
            text-align: center;
            z-index: 1;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body>
    <img src="src/logo.png" alt="Logo" style="position: absolute; top: 20px; left: 20px; width: 300px; height: auto; z-index: 2;">
    <video id="video-background" autoplay muted loop>
        <source src="src/The_camera_is_202510151708.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div id="nav-icon" style="position: absolute;top: 104px;right: 63px;cursor: pointer;z-index: 2;">
        <div style="width: 60px; height: 5px; background: yellow; margin: 8px;"></div>
        <div style="width: 60px; height: 5px; background: yellow; margin: 8px;"></div>
        <div style="width: 60px; height: 5px; background: yellow; margin: 8px;"></div>
    </div>
    <script>
        const video = document.getElementById('video-background');
        document.addEventListener('mousemove', (event) => {
            const x = (event.clientX / window.innerWidth) - 0.5;
            const y = (event.clientY / window.innerHeight) - 0.5;
            video.style.transform = `translate(-50%, -50%) translate(${x * 30}px, ${y * 30}px)`;
        });
    </script>
</body>
</html>
